services:
  terra:
    image: terraquest:local
    build: .
    mem_limit: 50000000
    memswap_limit: 50000000
    read_only: true
    environment:
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      AUTH_SECRET: ${AUTH_SECRET:-}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
      AUTH_APPLE_ID: ${AUTH_APPLE_ID:-}
      AUTH_APPLE_SECRET: ${AUTH_APPLE_SECRET:-}
    ports:
      - "${TERRA_BIND:-127.0.0.1}:${TERRA_PORT:-3000}:3000"
    volumes:
      - terra-data:/var/lib/terra
    logging:
      driver: local
      options:
        max-size: "2m"
        max-file: "2"
    restart: unless-stopped
volumes:
  terra-data:
